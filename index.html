<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오프 로드 - 3D 물류 시뮬레이션</title>
  </head>
  <body>
  <div class="drive-menu" role="menu" aria-label="운전 조작">
    <h4>운전 조작</h4>
    <ul>
      <li><span class="key">W / ↑</span><span class="action">전진</span></li>
      <li><span class="key">S / ↓</span><span class="action">후진</span></li>
      <li><span class="key">A / ←</span><span class="action">좌회전</span></li>
      <li><span class="key">D / →</span><span class="action">우회전</span></li>
      <li><span class="key">Space</span><span class="action">브레이크</span></li>
      <li><span class="key">B</span><span class="action">비상등</span></li>
      <li><span class="key">L</span><span class="action">라이트</span></li>
    </ul>
    <h4>편집 조작</h4>
    <ul>
      <li><span class="key">X</span><span class="action">삭제</span></li>
    </ul>
  </div>
    <button class="recordBtn" id="recordBtn">🎬 녹화</button>
    <canvas class="game"></canvas>
    <script type="module">
      const recordBtn = document.getElementById('recordBtn');
      const isLocal =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1';

      if (!isLocal) {
        recordBtn.style.display = 'none';
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
